name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test

  pr-title:
    name: PR 제목 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits 형식과 한국어 설명 확인
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qP '^(feat|fix|refactor|docs|test|chore)(\([a-z0-9-]+\))?: .*\p{Hangul}' <<< "$PR_TITLE"; then
            echo "::error::PR 제목은 '<type>(<scope>): <한국어 설명>' 형식이어야 합니다. type: feat, fix, refactor, docs, test, chore"
            exit 1
          fi
