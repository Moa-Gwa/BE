name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test

  image:
    name: 이미지 빌드
    needs: test
    # PR 제목·본문 수정(edited)은 코드 변경이 없어 다시 빌드하지 않음
    if: github.event.action != 'edited'
    # 운영 노드(EC2 Graviton)와 같은 ARM 러너에서 에뮬레이션 없이 빌드
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 태그 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moa-gwa/be
          # sha-<짧은 해시>: 배포에 쓰는 고정 태그, 브랜치 이름: 최신 빌드 확인용
          tags: |
            type=sha
            type=ref,event=branch
      - name: 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          # PR은 빌드만 검증
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 배포 태그 갱신
    needs: image
    # main 푸시만 운영 배포, develop은 이미지 빌드까지
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 같은 저장소의 배포 커밋이 순서대로 쌓이도록 한 번에 하나만 실행
    concurrency: deploy-tag
    steps:
      - name: infra 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          repository: Moa-Gwa/infra
          # infra 쓰기 전용 deploy key. GITHUB_TOKEN은 이 저장소에만 쓸 수 있음
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - name: 이미지 태그 변경·푸시
        env:
          IMAGE: ghcr.io/moa-gwa/be
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          FILE=k8s/overlays/prod/kustomization.yaml
          # images 항목에서 이 이미지 이름 다음 줄의 newTag 교체
          sed -i "\#name: ${IMAGE}\$#{n;s#newTag: .*#newTag: ${TAG}#;}" "$FILE"
          grep -A1 "name: ${IMAGE}$" "$FILE" | grep -q "newTag: ${TAG}$" || { echo "::error::${FILE}에서 ${IMAGE} 태그를 찾지 못함"; exit 1; }
          git diff --quiet && { echo "이미 ${TAG} 배포 상태"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(deploy): 서버 이미지 ${TAG} 배포" -m "$SOURCE"
          # 다른 저장소 CI가 먼저 푸시했으면 최신 커밋 위로 옮겨 다시 시도
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

  pr-title:
    name: PR 제목 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits 형식과 한국어 설명 확인
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qP '^(feat|fix|refactor|docs|test|chore)(\([a-z0-9-]+\))?: .*\p{Hangul}' <<< "$PR_TITLE"; then
            echo "::error::PR 제목은 '<type>(<scope>): <한국어 설명>' 형식이어야 합니다. type: feat, fix, refactor, docs, test, chore"
            exit 1
          fi
