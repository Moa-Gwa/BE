name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test

  image:
    name: 이미지 빌드
    needs: test
    # PR 제목 수정만으로는 다시 빌드하지 않음
    if: github.event.action != 'edited'
    # 운영 노드(EC2 Graviton)와 같은 ARM 러너에서 에뮬레이션 없이 빌드
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 태그 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moa-gwa/be
          # sha-<짧은 해시>: 배포에 쓰는 고정 태그, 브랜치 이름: 최신 빌드 확인용
          tags: |
            type=sha
            type=ref,event=branch
      - name: 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          # PR은 빌드만 검증
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-title:
    name: PR 제목 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits 형식과 한국어 설명 확인
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qP '^(feat|fix|refactor|docs|test|chore)(\([a-z0-9-]+\))?: .*\p{Hangul}' <<< "$PR_TITLE"; then
            echo "::error::PR 제목은 '<type>(<scope>): <한국어 설명>' 형식이어야 합니다. type: feat, fix, refactor, docs, test, chore"
            exit 1
          fi
