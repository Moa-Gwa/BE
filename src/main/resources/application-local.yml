spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/moagwa
    username: moagwa
    password: moagwa

moagwa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://[::1]:3000,https://[::1]:3000}
  jwt:
    secret: local-dev-only-secret-change-me-0123456789
  auth:
    cookie:
      secure: false
  dev-data: true
  instagram-snapshot-import:
    enabled: ${INSTAGRAM_SNAPSHOT_IMPORT_ENABLED:true}
  verification:
    expose-code: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
