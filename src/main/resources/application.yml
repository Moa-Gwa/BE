spring:
  application:
    name: moagwa-be
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

moagwa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://[::1]:3000}
  jwt:
    secret: ${JWT_SECRET}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  firebase:
    # 서비스 계정 키(JSON) 파일의 절대 경로. 저장소 밖에 두고 환경변수로만 넘긴다. 비어 있으면 푸시 발송을 건너뛴다.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  google:
    # 구글 로그인을 허용할 이메일 도메인(예: school.ac.kr). 비어 있으면 모든 구글 계정을 허용한다.
    allowed-email-domain: ${GOOGLE_ALLOWED_EMAIL_DOMAIN:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}

crawler:
  enabled: ${CRAWLER_ENABLED:true}
  interval: PT10M
  initial-delay: PT30S
  concurrent-limit: 5
  request-timeout: PT10S
  max-retries: 3
  retry-delay: PT2S
  detail-retry-batch: 20
  instagram:
    # Runs Node.js + Playwright on this server. No Apify Actor or API token is used.
    enabled: ${INSTAGRAM_CRAWLER_ENABLED:false}
    interval: ${INSTAGRAM_CRAWLER_INTERVAL:P1D}
    initial-delay: ${INSTAGRAM_CRAWLER_INITIAL_DELAY:PT1M}
    results-limit: ${INSTAGRAM_CRAWLER_RESULTS_LIMIT:3}
    node-command: ${INSTAGRAM_CRAWLER_NODE:node}
    profile-links-script: ${INSTAGRAM_PROFILE_LINKS_SCRIPT:instagram-browser-scraper/src/collect-profile-links.js}
    post-details-script: ${INSTAGRAM_POST_DETAILS_SCRIPT:instagram-browser-scraper/src/collect-post-details.js}
    command-timeout: ${INSTAGRAM_CRAWLER_COMMAND_TIMEOUT:PT3M}
