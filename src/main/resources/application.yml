spring:
  application:
    name: moagwa-be
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

moagwa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}

crawler:
  enabled: ${CRAWLER_ENABLED:true}
  interval: PT10M
  initial-delay: PT30S
  concurrent-limit: 5
  request-timeout: PT10S
  max-retries: 3
  retry-delay: PT2S
  detail-retry-batch: 20
